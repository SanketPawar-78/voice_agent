<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent - Live Calls</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d37;--tx:#e6edf3;--mut:#8b949e;
--vad:#8b949e;--stt:#58a6ff;--llm:#bc8cff;--tts:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--tts);box-shadow:0 0 8px var(--tts)}
header .sp{flex:1}
button{background:#21262d;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
main{padding:16px 20px;display:grid;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.card .l{color:var(--mut);font-size:12px}.card .v{font-size:24px;font-weight:600}.card .s{color:var(--mut);font-size:11px}
.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.4fr);gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel h2{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.panel h2 .sp{flex:1}
.body{padding:10px 14px}
.empty{color:var(--mut);padding:16px;text-align:center}
.live{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.live:hover{border-color:var(--acc)}
.live .t{display:flex;justify-content:space-between}
.pill{border-radius:10px;padding:1px 8px;font-size:11px;background:#21262d}
.pill.speaking{background:#12341d;color:var(--tts)}.pill.thinking{background:#2a1f45;color:var(--llm)}.pill.user{background:#10294a;color:var(--stt)}
#feed{height:300px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace}
#feed div{padding:2px 0;border-bottom:1px dashed #1d232c}
.tag{display:inline-block;padding:0 6px;border-radius:4px;margin-right:4px;font-size:11px}
.tag.stt{background:#10294a;color:var(--stt)}.tag.llm{background:#2a1f45;color:var(--llm)}
.tag.tts{background:#12341d;color:var(--tts)}.tag.total{background:#3a2c0b;color:var(--warn)}
.tag.bad{background:#3d1517;color:var(--bad)}
.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:500;font-size:12px}
tr.row{cursor:pointer}tr.row:hover{background:#1c222b}tr.sel{background:#1c2a3d}
.ms.good{color:var(--tts)}.ms.mid{color:var(--warn)}.ms.high{color:var(--bad)}
canvas{width:100%;height:120px;display:block;background:#0b0f14;border-radius:6px;cursor:pointer}
audio{width:100%;margin:8px 0}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:#0b0f14;min-width:140px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:6px 0}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tl .m{padding:6px 8px;border-radius:6px;margin-bottom:6px;background:#0f141a;border-left:3px solid var(--line);cursor:pointer}
.tl .m.user{border-color:var(--stt)}.tl .m.assistant{border-color:var(--tts)}.tl .m.now{background:#1c2a3d}
.tl .m small{color:var(--mut)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><h1>Voice Agent</h1><span class="mut" id="conn">connecting...</span>
  <span class="sp"></span>
  <input id="dial" placeholder="+91XXXXXXXXXX" style="background:#0b0f14;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:150px">
  <button id="dialbtn">Call (outbound)</button>
  <button id="keybtn">API key</button>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="grid">
    <div style="display:grid;gap:16px;align-content:start">
      <div class="panel"><h2>Live calls <span class="pill" id="activeCount">0</span></h2>
        <div class="body" id="live"><div class="empty">No active calls</div></div></div>
      <div class="panel"><h2>Live event feed <span class="sp"></span><button id="clearfeed">clear</button></h2>
        <div class="body" id="feed"></div></div>
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="panel"><h2>Calls <span class="sp"></span><button id="refresh">refresh</button></h2>
        <div style="max-height:300px;overflow:auto"><table><thead><tr><th>Started</th><th>From</th><th>Dir</th><th>Dur</th><th>Avg latency</th><th></th></tr></thead>
        <tbody id="calls"></tbody></table></div></div>
      <div class="panel" id="detail" style="display:none"><h2 id="dtitle">Call</h2>
        <div class="body">
          <canvas id="wave" height="120"></canvas>
          <audio id="audio" controls></audio>
          <div class="legend"><span><b style="background:var(--vad)"></b>End-of-speech wait (VAD)</span><span><b style="background:var(--stt)"></b>STT</span><span><b style="background:var(--llm)"></b>LLM (first sentence)</span><span><b style="background:var(--tts)"></b>TTS (first sentence)</span></div>
          <table><thead><tr><th>#</th><th>Reply latency</th><th>VAD</th><th>STT</th><th>LLM</th><th>TTS</th><th>Total</th></tr></thead><tbody id="lat"></tbody></table>
          <h3 style="font-size:13px;margin:14px 0 6px">Transcript (click to seek)</h3>
          <div class="tl" id="tl"></div>
        </div></div>
    </div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY=localStorage.getItem('voiceagent_key')||'';
const active=new Map();let selected=null,turns=[],waveData=null,es=null,statsTimer=null;

function askKey(){const k=prompt('API key (API_KEY from .env):',KEY);if(k!==null){KEY=k;localStorage.setItem('voiceagent_key',k);location.reload()}}
$('#keybtn').onclick=askKey;
$('#dialbtn').onclick=async()=>{
  const to=$('#dial').value.trim();if(!to)return;
  const r=await fetch('/api/calls/outbound',{method:'POST',headers:{'X-API-Key':KEY,'Content-Type':'application/json'},body:JSON.stringify({to})});
  if(r.ok){feed(Date.now()/1000,'outbound','<span class="tag total">DIAL</span>calling '+esc(to)+'...')}
  else{const t=await r.text();feed(Date.now()/1000,'outbound','<span class="tag bad">DIAL FAILED</span>'+esc(t.slice(0,200)))}
};
async function api(p){const r=await fetch(p,{headers:{'X-API-Key':KEY}});if(r.status===401){askKey();throw 0}if(!r.ok)throw new Error(r.status);return r}
const cls=ms=>ms==null?'':ms<1200?'good':ms<2000?'mid':'high';
const fmt=ms=>ms==null?'-':ms+' ms';
const msHtml=ms=>`<span class="ms ${cls(ms)}">${fmt(ms)}</span>`;
const clock=t=>new Date(t*1000).toLocaleTimeString();
const short=id=>id.slice(0,6);

/* ---------- stats cards ---------- */
async function loadStats(){
  const s=await (await api('/api/stats')).json();
  const c=(l,v,sub='')=>`<div class="card"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const st=k=>s[k].avg==null?'-':s[k].avg+' ms';
  $('#cards').innerHTML=
    c('Active calls',s.active,`${s.calls} total calls`)+
    c('Reply latency p50',s.total_ms.p50==null?'-':s.total_ms.p50+' ms',`p95 ${fmt(s.total_ms.p95)} | ${s.replies} replies`)+
    c('Avg VAD wait',st('vad_ms'),'end-of-speech silence')+
    c('Avg STT',st('stt_ms'),`p95 ${fmt(s.stt_ms.p95)}`)+
    c('Avg LLM',st('llm_ms'),`p95 ${fmt(s.llm_ms.p95)}`)+
    c('Avg TTS',st('tts_ms'),`p95 ${fmt(s.tts_ms.p95)}`);
}
function scheduleStats(){clearTimeout(statsTimer);statsTimer=setTimeout(loadStats,500)}

/* ---------- live calls + feed ---------- */
function renderLive(){
  $('#activeCount').textContent=active.size;
  if(!active.size){$('#live').innerHTML='<div class="empty">No active calls</div>';return}
  $('#live').innerHTML=[...active.values()].map(a=>`<div class="live" data-id="${esc(a.call_id)}">
    <div class="t"><b>${esc(a.caller||'unknown')}</b><span class="pill ${esc(a.state||'')}">${esc(a.label||'listening')}</span></div>
    <div class="mut">${esc(a.agent||'')} - ${esc(a.direction||'')} - <span data-timer="${a.started}">0s</span>
    ${a.last_total!=null?' - last reply '+msHtml(a.last_total):''}</div></div>`).join('');
}
function tickTimers(){document.querySelectorAll('[data-timer]').forEach(e=>{const s=Math.floor(Date.now()/1000-e.dataset.timer);e.textContent=Math.floor(s/60)+'m '+s%60+'s'})}
setInterval(tickTimers,1000);
function feed(ts,id,html){
  const d=document.createElement('div');d.innerHTML=`<span class="mut">${clock(ts)}</span> <span class="mut">[${esc(short(id))}]</span> ${html}`;
  const f=$('#feed');f.prepend(d);while(f.children.length>300)f.lastChild.remove();
}
$('#clearfeed').onclick=()=>$('#feed').innerHTML='';
$('#live').onclick=e=>{const el=e.target.closest('.live');if(el)openCall(el.dataset.id)};

function onEvent(m){
  const a=active.get(m.call_id);
  switch(m.type){
    case 'snapshot':active.clear();m.active.forEach(c=>active.set(c.call_id,{...c,started:c.ts}));renderLive();return;
    case 'call_started':active.set(m.call_id,{...m,started:m.ts,label:'greeting',state:'speaking'});
      feed(m.ts,m.call_id,`<span class="tag tts">CALL</span>started from <b>${esc(m.caller||'?')}</b> (${esc(m.direction)})`);break;
    case 'speech_start':if(a){a.label='caller speaking';a.state='user'}break;
    case 'stage':{
      const t={stt:'stt',llm:'llm',tts:'tts',total:'total'}[m.stage]||'bad';
      const name={stt:'STT',llm:'LLM first sentence',tts:'TTS first audio',total:'TOTAL reply latency'}[m.stage]||m.stage;
      feed(m.ts,m.call_id,`<span class="tag ${t}">${esc(name)}</span><b>${m.ms} ms</b>`);
      if(a){if(m.stage==='stt'||m.stage==='llm'){a.label='thinking';a.state='thinking'}
        if(m.stage==='tts'){a.label='speaking';a.state='speaking'}
        if(m.stage==='total')a.last_total=m.ms}
      break}
    case 'user_utterance':feed(m.ts,m.call_id,`<span class="tag stt">CALLER${m.lang?' '+esc(m.lang):''}</span>${esc(m.text)}`);break;
    case 'agent_reply':feed(m.ts,m.call_id,`<span class="tag tts">AGENT</span>${esc(m.text)}${m.interrupted?' <span class="tag bad">interrupted</span>':''}`);
      if(a){a.label='listening';a.state=''}scheduleStats();break;
    case 'interrupted':feed(m.ts,m.call_id,'<span class="tag bad">BARGE-IN</span>caller interrupted agent');if(a){a.label='caller speaking';a.state='user'}break;
    case 'error':feed(m.ts,m.call_id,`<span class="tag bad">ERROR</span>${esc(m.message)}`);break;
    case 'call_ended':active.delete(m.call_id);
      feed(m.ts,m.call_id,`<span class="tag total">CALL</span>ended after ${m.duration_s}s`);loadCalls();scheduleStats();
      if(selected===m.call_id)openCall(m.call_id);break;
  }
  renderLive();
}
function connect(){
  if(es)es.close();
  es=new EventSource('/api/stream?key='+encodeURIComponent(KEY));
  es.onopen=()=>{$('#dot').classList.add('on');$('#conn').textContent='live'};
  es.onerror=()=>{$('#dot').classList.remove('on');$('#conn').textContent='reconnecting...'};
  es.onmessage=e=>onEvent(JSON.parse(e.data));
}

/* ---------- calls list ---------- */
async function loadCalls(){
  const rows=await (await api('/api/calls')).json();
  $('#calls').innerHTML=rows.length?rows.map(c=>`<tr class="row ${c.id===selected?'sel':''}" data-id="${c.id}">
    <td>${new Date(c.started_at).toLocaleString()}</td><td>${esc(c.from||'-')}</td><td>${esc(c.direction)}</td>
    <td>${c.duration_s==null?'<span class="pill speaking">live</span>':c.duration_s+'s'}</td>
    <td>${msHtml(c.avg_total_ms)}</td><td>${c.has_recording?'&#9654;':''}</td></tr>`).join('')
    :'<tr><td colspan="6" class="empty">No calls yet - call your Exotel number</td></tr>';
}
$('#calls').onclick=e=>{const r=e.target.closest('tr.row');if(r)openCall(r.dataset.id)};
$('#refresh').onclick=loadCalls;

/* ---------- call detail / replay ---------- */
async function openCall(id){
  selected=id;
  const d=await (await api('/api/calls/'+id)).json();
  turns=d.turns;$('#detail').style.display='';
  $('#dtitle').textContent=`Call ${short(id)} - ${d.call.from||'unknown'} - ${d.call.duration_s??'live'}s`;
  loadCalls();
  renderLatency();renderTranscript();
  waveData=null;const au=$('#audio');
  if(d.call.has_recording){
    const buf=await (await api(`/api/calls/${id}/recording`)).arrayBuffer();
    au.src=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
    try{const ctx=new AudioContext();const ab=await ctx.decodeAudioData(buf.slice(0));
      waveData=[ab.getChannelData(0),ab.getChannelData(1)];ctx.close()}catch(e){}
  }else{au.removeAttribute('src');au.load()}
  drawWave();
}
function renderLatency(){
  const rows=[];let n=0;
  turns.forEach(t=>{if(t.role!=='assistant')return;n++;
    if(t.total_ms==null){rows.push(`<tr><td>${n}</td><td colspan="6" class="mut">greeting</td></tr>`);return}
    const seg=[['vad_ms','--vad'],['stt_ms','--stt'],['llm_ms','--llm'],['tts_ms','--tts']];
    const sum=seg.reduce((a,[k])=>a+(t[k]||0),0)||1;
    const bar=seg.map(([k,c])=>`<i title="${k} ${t[k]} ms" style="width:${(t[k]||0)/sum*100}%;background:var(${c})"></i>`).join('');
    rows.push(`<tr><td>${n}${t.interrupted?' &#9988;':''}</td><td><div class="bar">${bar}</div></td>
      <td>${t.vad_ms}</td><td>${t.stt_ms}</td><td>${t.llm_ms}</td><td>${t.tts_ms}</td><td><b>${msHtml(t.total_ms)}</b></td></tr>`)});
  $('#lat').innerHTML=rows.join('')||'<tr><td colspan="7" class="empty">No replies yet</td></tr>';
}
function renderTranscript(){
  $('#tl').innerHTML=turns.map((t,i)=>`<div class="m ${t.role}" data-i="${i}"><small>${t.role==='user'?'Caller':'Agent'}${t.offset_ms!=null?' - '+(t.offset_ms/1000).toFixed(1)+'s':''}${t.interrupted?' - interrupted':''}</small><br>${esc(t.text)}</div>`).join('')
   ||'<div class="empty">No transcript</div>';
}
$('#tl').onclick=e=>{const m=e.target.closest('.m');if(!m)return;const t=turns[m.dataset.i];
  if(t.offset_ms!=null&&$('#audio').src){$('#audio').currentTime=t.offset_ms/1000;$('#audio').play()}};
function drawWave(){
  const cv=$('#wave'),dpr=devicePixelRatio||1,W=cv.clientWidth*dpr,H=cv.height=120*dpr;cv.width=W;
  const g=cv.getContext('2d');g.clearRect(0,0,W,H);
  const au=$('#audio'),dur=(waveData?waveData[0].length/8000:0)||au.duration||1;
  g.fillStyle='#8b949e';g.font=`${10*dpr}px sans-serif`;g.fillText('caller',4,10*dpr);g.fillText('agent',4,H/2+10*dpr);
  if(waveData)[0,1].forEach(ch=>{const d=waveData[ch],mid=H/4+ch*H/2,amp=H/4-6*dpr,step=Math.max(1,Math.floor(d.length/W));
    g.fillStyle=ch?'#3fb950':'#58a6ff';
    for(let x=0;x<W;x++){let mn=0,mx=0;for(let i=x*step;i<(x+1)*step&&i<d.length;i++){if(d[i]<mn)mn=d[i];if(d[i]>mx)mx=d[i]}
      g.fillRect(x,mid-mx*amp,1,Math.max(1,(mx-mn)*amp))}});
  turns.forEach(t=>{if(t.offset_ms==null)return;g.fillStyle=t.role==='user'?'#58a6ff':'#3fb950';g.fillRect(t.offset_ms/1000/dur*W,0,2*dpr,H)});
  g.fillStyle='#f0f6fc';g.fillRect((au.currentTime||0)/dur*W,0,2*dpr,H);
  // highlight current transcript item
  const cur=(au.currentTime||0)*1000;let idx=-1;turns.forEach((t,i)=>{if(t.offset_ms!=null&&t.offset_ms<=cur)idx=i});
  document.querySelectorAll('#tl .m').forEach((e,i)=>e.classList.toggle('now',i===idx&&!au.paused));
}
$('#wave').onclick=e=>{const au=$('#audio'),dur=(waveData?waveData[0].length/8000:0)||au.duration;
  if(dur)au.currentTime=e.offsetX/e.target.clientWidth*dur};
$('#audio').addEventListener('timeupdate',drawWave);$('#audio').addEventListener('seeked',drawWave);
addEventListener('resize',drawWave);

loadStats();loadCalls();connect();
</script>
</body>
</html>
